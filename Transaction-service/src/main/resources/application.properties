spring.application.name=transaction-service
server.port=8083

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/transactions_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# URLs des autres services (seront écrasées par Docker Compose)
services.account.url=${ACCOUNT_SERVICE_URL:http://localhost:8082}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}